[project]
name = "swatter"
version = "0.1.0"
description = "Turns Slack bug reports into deduplicated GitHub issues and tells the reporter when they close."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "slack-bolt>=1.21",
    "slack-sdk>=3.33",
    "PyGithub>=2.5",
    "openai>=1.60",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "fastembed>=0.5",
    "numpy>=2.0",
    "pyyaml>=6.0",
]

[project.scripts]
swatter = "swatter.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/swatter"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
